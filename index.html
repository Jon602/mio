<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ScoopTrack - Ice Cream Stock Tracker</title>

  <!-- iOS PWA Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ScoopTrack">
  <link rel="apple-touch-icon" href="https://img.icons8.com/3d-fluency/180/ice-cream-cone.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'],
          },
          colors: {
            iosBg: '#F2F2F7',
            iosCard: 'rgba(255, 255, 255, 0.88)',
            iosBlue: '#007AFF',
            iosRed: '#FF3B30',
            iosGreen: '#34C759',
            iosAmber: '#FF9500',
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- SortableJS for flawless Mobile & Desktop Touch Dragging -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    /* iOS Custom Styling & Touch Enhancements */
    body {
      background-color: #F2F2F7;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: env(safe-area-inset-bottom, 20px);
      padding-top: env(safe-area-inset-top, 0px);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .glass-nav {
      background: rgba(249, 249, 249, 0.88);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.12);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 10px;
    }

    .btn-press {
      transition: transform 0.1s ease, opacity 0.1s ease;
    }
    .btn-press:active {
      transform: scale(0.93);
      opacity: 0.8;
    }

    /* Sortable Dragging Visual State */
    .sortable-ghost {
      opacity: 0.3;
      background-color: #bae6fd !important;
    }
    .sortable-chosen {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="text-slate-900 font-sans antialiased min-h-screen flex flex-col pb-12">

  <!-- Header / Navigation Bar -->
  <header class="sticky top-0 z-30 glass-nav px-4 py-3 sm:px-6 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white shadow-md shadow-pink-200">
          <i class="fa-solid fa-ice-cream text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-slate-900 leading-tight">ScoopTrack</h1>
          <p class="text-[11px] text-slate-500 font-medium leading-none" id="syncStatus">
            <i class="fa-solid fa-circle-notch fa-spin text-iosBlue mr-1"></i> Loading app...
          </p>
        </div>
      </div>

      <!-- Header Action Buttons -->
      <div class="flex items-center space-x-2">
        <button onclick="openPwaModal()" class="btn-press px-3 py-1.5 rounded-full bg-white/80 border border-slate-200 text-xs font-semibold text-slate-700 shadow-sm flex items-center space-x-1">
          <i class="fa-solid fa-square-plus text-iosBlue"></i>
          <span class="hidden sm:inline">Add to Home Screen</span>
        </button>
        <button onclick="addDivider()" class="btn-press px-3 py-1.5 rounded-full bg-slate-200/80 border border-slate-300 text-xs font-semibold text-slate-700 shadow-sm flex items-center space-x-1" title="Add Divider">
          <i class="fa-solid fa-grip-lines text-slate-500"></i>
          <span class="hidden sm:inline">Add Divider</span>
        </button>
        <button onclick="openAddFlavorModal()" class="btn-press w-8 h-8 rounded-full bg-iosBlue text-white flex items-center justify-center shadow-md
