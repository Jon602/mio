<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>miogelato - Ice Cream Stock Tracker</title>

  <!-- iOS PWA Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="miogelato">
  <link rel="apple-touch-icon" href="./mio-circle.png">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- SortableJS for Touch Dragging -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #F2F2F7;
      color: #1c1c1e;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: env(safe-area-inset-bottom, 20px);
      padding-top: env(safe-area-inset-top, 0px);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(249, 249, 249, 0.88);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.12);
      padding: 10px 16px;
    }

    .nav-container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    main {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 10px 16px;
      flex-grow: 1;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .stat-box {
      text-align: center;
    }

    .stat-title {
      font-size: 10px;
      font-weight: 700;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 900;
      color: #1c1c1e;
      margin-top: 1px;
    }

    #flavorGrid {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .draggable-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.90);
      border-radius: 12px;
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .drag-handle {
      color: #aeaeb2;
      cursor: grab;
      padding: 4px;
      margin-right: 6px;
      font-size: 13px;
    }
    .drag-handle:active {
      cursor: grabbing;
    }

    .flavor-name {
      font-weight: 700;
      font-size: 14px;
      color: #1c1c1e;
      word-break: break-word;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-count {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.1);
      font-weight: 900;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f2f7;
      color: #1c1c1e;
      cursor: pointer;
    }
    .btn-count.plus {
      background: rgba(0, 122, 255, 0.1);
      color: #007AFF;
      border-color: rgba(0, 122, 255, 0.2);
    }

    .stock-box {
      min-width: 24px;
      text-align: left;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-right: 2px;
    }

    .stock-num {
      font-size: 16px;
      font-weight: 900;
    }

    .btn-press {
      transition: transform 0.1s ease, opacity 0.1s ease;
      cursor: pointer;
    }
    .btn-press:active {
      transform: scale(0.93);
      opacity: 0.8;
    }

    .header-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn {
      padding: 5px 10px;
      border-radius: 16px;
      background: rgba(255,255,255,0.8);
      border: 1px solid #d1d1d6;
      font-size: 11px;
      font-weight: 600;
      color: #3a3a3c;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .add-flavor-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #007AFF;
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    /* Divider Row Styling */
    .divider-row {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 3px 12px;
      gap: 6px;
      cursor: pointer;
    }
    .divider-line {
      flex-grow: 1;
      height: 2px;
      background-color: #1c1c1e;
      border-radius: 2px;
    }
    .divider-text {
      font-size: 10px;
      font-weight: 800;
      color: #1c1c1e;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 0 6px;
      white-space: nowrap;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.hidden {
      display: none;
    }
    .modal-card {
      background: white;
      border-radius: 24px;
      max-width: 400px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-group label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #8e8e93;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #c7c7cc;
      font-size: 14px;
      outline: none;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .btn-main {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      background: #007AFF;
      color: white;
      border: none;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-secondary {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      background: #f2f2f7;
      color: #3a3a3c;
      border: 1px solid #c7c7cc;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <div style="display: flex; align-items: center; gap: 8px;">
        <img src="./mio-circle.png" alt="Logo" width="32" height="32" style="width: 32px; height: 32px; border-radius: 10px; object-fit: cover; box-shadow: 0 3px 8px rgba(0,0,0,0.15);" onError="this.onerror=null;this.src='https://img.icons8.com/3d-fluency/180/ice-cream-cone.png';">
        <div>
          <h1 style="font-size: 15px; font-weight: 800; line-height: 1.1;">miogelato</h1>
          <p id="syncStatus" style="font-size: 10px; color: #8e8e93; font-weight: 500;">
            <i class="fa-solid fa-circle-notch fa-spin" style="color: #007AFF;"></i> Loading app...
          </p>
        </div>
      </div>

      <div class="header-btns">
        <button onclick="openPwaModal()" class="btn-press action-btn">
          <i class="fa-solid fa-square-plus" style="color: #007AFF;"></i>
          <span style="display: none;">Install</span>
        </button>
        <button onclick="addDivider()" class="btn-press action-btn" title="Add Divider">
          <i class="fa-solid fa-grip-lines" style="color: #8e8e93;"></i>
        </button>
        <button onclick="openAddFlavorModal()" class="btn-press add-flavor-btn" title="Add New Flavor">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Stats Dashboard -->
    <section class="stats-grid">
      <div class="glass-card stat-box">
        <p class="stat-title">Total Tubs</p>
        <p id="statTotalStock" class="stat-value">0</p>
      </div>
      <div class="glass-card stat-box">
        <p class="stat-title">Flavors</p>
        <p id="statTotalFlavors" class="stat-value">0</p>
      </div>
    </section>

    <!-- Flavor List -->
    <section id="flavorGrid">
      <!-- Rendered via JS -->
    </section>

    <div id="emptyState" class="hidden" style="text-align: center; padding: 40px 0; color: #8e8e93;">
      <i class="fa-solid fa-box-open" style="font-size: 36px; margin-bottom: 8px;"></i>
      <p style="font-size: 13px; font-weight: 600;">No flavors found</p>
    </div>
  </main>

  <!-- EDIT MODAL -->
  <div id="editModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 class="modal-title" style="margin:0;">Edit Flavor</h3>
        <button onclick="closeEditModal()" style="background:#f2f2f7; border:none; width:28px; height:28px; border-radius:50%; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="hidden" id="editFlavorId">
      <div class="input-group">
        <label>Flavor Name</label>
        <input type="text" id="editFlavorName">
      </div>
      <div class="input-group">
        <label>Stock Count</label>
        <input type="number" id="editFlavorStock" min="0">
      </div>
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button onclick="deleteCurrentFlavor()" style="padding: 10px 14px; border-radius: 12px; background: #fff; border: 1px solid #ff3b30; color: #ff3b30; font-weight: 700; cursor:pointer;">Delete</button>
        <button onclick="closeEditModal()" class="btn-secondary">Cancel</button>
        <button onclick="saveFlavorEdit()" class="btn-main">Save</button>
      </div>
    </div>
  </div>

  <!-- ADD MODAL -->
  <div id="addModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 class="modal-title" style="margin:0;">Add New Flavor</h3>
        <button onclick="closeAddModal()" style="background:#f2f2f7; border:none; width:28px; height:28px; border-radius:50%; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="input-group">
        <label>Flavor Name</label>
        <input type="text" id="addFlavorName" placeholder="e.g. Salted Caramel">
      </div>
      <div class="input-group">
        <label>Initial Stock</label>
        <input type="number" id="addFlavorStock" value="10" min="0">
      </div>
      <div class="modal-actions">
        <button onclick="closeAddModal()" class="btn-secondary">Cancel</button>
        <button onclick="saveNewFlavor()" class="btn-main">Add</button>
      </div>
    </div>
  </div>

  <!-- PWA MODAL -->
  <div id="pwaModal" class="modal-overlay hidden" style="align-items: flex-end;">
    <div class="modal-card" style="border-radius: 24px 24px 0 0;">
      <h3 class="modal-title">Install miogelato</h3>
      <p style="font-size: 12px; color: #636366; margin-bottom: 12px;">Tap the Share button <i class="fa-solid fa-share-from-square" style="color:#007AFF;"></i> in Safari, then select <strong>'Add to Home Screen'</strong>.</p>
      <button onclick="closePwaModal()" class="btn-main" style="width:100%;">Got it!</button>
    </div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const DEFAULT_30_FLAVORS = [
      { id: 'f1', name: 'Vanilla Bean', stock: 12, order: 0, isDivider: false },
      { id: 'f2', name: 'Double Chocolate', stock: 8, order: 1, isDivider: false },
      { id: 'f3', name: 'Strawberry Cream', stock: 15, order: 2, isDivider: false },
      { id: 'f4', name: 'Mint Choc Chip', stock: 4, order: 3, isDivider: false },
      { id: 'f5', name: 'Salted Caramel', stock: 6, order: 4, isDivider: false },
      { id: 'f6', name: 'Cookies & Cream', stock: 10, order: 5, isDivider: false },
      { id: 'f7', name: 'Mango Sorbet', stock: 3, order: 6, isDivider: false },
      { id: 'f8', name: 'Pistachio', stock: 7, order: 7, isDivider: false },
      { id: 'f9', name: 'Bubblegum', stock: 2, order: 8, isDivider: false },
      { id: 'f10', name: 'Rum & Raisin', stock: 9, order: 9, isDivider: false },
      { id: 'f11', name: 'Rocky Road', stock: 11, order: 10, isDivider: false },
      { id: 'f12', name: 'Raspberry Ripple', stock: 5, order: 11, isDivider: false },
      { id: 'f13', name: 'Espresso Fudge', stock: 1, order: 12, isDivider: false },
      { id: 'f14', name: 'Coconut Cream', stock: 8, order: 13, isDivider: false },
      { id: 'f15', name: 'Lemon Sorbet', stock: 14, order: 14, isDivider: false },
      { id: 'f16', name: 'Honeycomb Crunch', stock: 4, order: 15, isDivider: false },
      { id: 'f17', name: 'Banana Split', stock: 6, order: 16, isDivider: false },
      { id: 'f18', name: 'Peanut Butter Swirl', stock: 0, order: 17, isDivider: false },
      { id: 'f19', name: 'Blackcurrant Sorbet', stock: 7, order: 18, isDivider: false },
      { id: 'f20', name: 'Passionfruit', stock: 9, order: 19, isDivider: false },
      { id: 'f21', name: 'Cherry Bakewell', stock: 5, order: 20, isDivider: false },
      { id: 'f22', name: 'Cotton Candy', stock: 12, order: 21, isDivider: false },
      { id: 'f23', name: 'Matcha Green Tea', stock: 4, order: 22, isDivider: false },
      { id: 'f24', name: 'Nutella Hazelnut', stock: 15, order: 23, isDivider: false },
      { id: 'f25', name: 'Peach Melba', stock: 8, order: 24, isDivider: false },
      { id: 'f26', name: 'Blueberry Cheesecake', stock: 3, order: 25, isDivider: false },
      { id: 'f27', name: 'Praline Hazelnut', stock: 10, order: 26, isDivider: false },
      { id: 'f28', name: 'Biscoff / Speculoos', stock: 2, order: 27, isDivider: false },
      { id: 'f29', name: 'Salted Fudge', stock: 7, order: 28, isDivider: false },
      { id: 'f30', name: 'Dulce de Leche', stock: 11, order: 29, isDivider: false }
    ];

    let savedLocal = localStorage.getItem('miogelato_local_flavors');
    window.flavors = savedLocal ? JSON.parse(savedLocal) : JSON.parse(JSON.stringify(DEFAULT_30_FLAVORS));
    
    let db = null;
    let auth = null;
    let sortableInstance = null;

    window.addEventListener('DOMContentLoaded', () => {
      renderFlavors();
    });

    window.addEventListener('load', () => {
      initApp();
    });

    async function initApp() {
      renderFlavors();

      let firebaseConnected = false;
      setTimeout(() => {
        if (!firebaseConnected) updateSyncStatus(true, "Offline Mode");
      }, 2000);

      try {
        const firebaseConfig = {
          apiKey: "AIzaSyDkn-fkyqeGFh212M3rBvvzL_YuhxB5wc4",
          authDomain: "miogelato-532eb.firebaseapp.com",
          projectId: "miogelato-532eb",
          storageBucket: "miogelato-532eb.firebasestorage.app",
          messagingSenderId: "1032455156606",
          appId: "1:1032455156606:web:e557840246c994c393b92f"
        };

        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        await signInAnonymously(auth);
        firebaseConnected = true;
        setupRealtimeListener();
      } catch (err) {
        console.warn("Cloud connection bypassed:", err);
        updateSyncStatus(true, "Offline Mode");
      }
    }

    function setupRealtimeListener() {
      const colRef = collection(db, 'icecream_flavors');
      onSnapshot(colRef, async (snapshot) => {
        if (!snapshot.empty) {
          const list = [];
          snapshot.forEach(docSnap => {
            list.push({ id: docSnap.id, ...docSnap.data() });
          });
          list.sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
          window.flavors = list;
          saveToLocalStorage();
          updateSyncStatus(true, "Cloud Synced");
          renderFlavors();
        } else {
          await uploadLocalStateToCloud();
        }
      }, (error) => {
        console.warn("Firestore listener fallback:", error);
        updateSyncStatus(true, "Offline Mode");
      });
    }

    async function uploadLocalStateToCloud() {
      if (!db) return;
      try {
        const batch = writeBatch(db);
        window.flavors.forEach((item, index) => {
          if (item.order === undefined) item.order = index;
          const docRef = doc(db, 'icecream_flavors', item.id);
          batch.set(docRef, { 
            name: item.name, 
            stock: item.stock, 
            order: item.order, 
            isDivider: !!item.isDivider 
          });
        });
        await batch.commit();
        updateSyncStatus(true, "Cloud Synced");
      } catch (err) {
        console.error("Upload error:", err);
      }
    }

    function saveToLocalStorage() {
      localStorage.setItem('miogelato_local_flavors', JSON.stringify(window.flavors));
    }

    function updateSyncStatus(isLive, label) {
      const el = document.getElementById('syncStatus');
      if (!el) return;
      el.innerHTML = isLive 
        ? `<i class="fa-solid fa-cloud" style="color: #34C759;"></i> ${label}` 
        : `<i class="fa-solid fa-circle-notch fa-spin" style="color: #007AFF;"></i> ${label}`;
    }

    window.renderFlavors = function() {
      const grid = document.getElementById('flavorGrid');
      const emptyState = document.getElementById('emptyState');

      if (!grid) return;

      window.flavors.forEach((item, idx) => {
        if (item.order === undefined) item.order = idx;
      });

      const nonDividers = window.flavors.filter(f => !f.isDivider);
      const totalStock = nonDividers.reduce((acc, curr) => acc + (Number(curr.stock) || 0), 0);

      const statTotalStock = document.getElementById('statTotalStock');
      const statTotalFlavors = document.getElementById('statTotalFlavors');

      if (statTotalStock) statTotalStock.innerText = totalStock;
      if (statTotalFlavors) statTotalFlavors.innerText = nonDividers.length;

      if (window.flavors.length === 0) {
        grid.innerHTML = '';
        if (emptyState) emptyState.classList.remove('hidden');
        return;
      } else {
        if (emptyState) emptyState.classList.add('hidden');
      }

      grid.innerHTML = window.flavors.map((item) => {
        if (item.isDivider) {
          return `
            <div data-id="${item.id}" class="divider-row" data-divider-id="${item.id}">
              <div class="drag-handle"><i class="fa-solid fa-grip-vertical"></i></div>
              <div class="divider-line"></div>
              ${item.name ? `<span class="divider-text">${escapeHtml(item.name)}</span><div class="divider-line"></div>` : ''}
              <button onclick="event.stopPropagation(); deleteDivider('${item.id}')" style="border:none; background:#e5e5ea; width:18px; height:18px; border-radius:50%; cursor:pointer; color:#3a3a3c; display:flex; align-items:center; justify-content:center;" title="Remove Divider"><i class="fa-solid fa-xmark" style="font-size:8px;"></i></button>
            </div>
          `;
        }

        return `
          <div data-id="${item.id}" class="draggable-row" data-flavor-id="${item.id}">
            <div style="display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;">
              <div class="drag-handle"><i class="fa-solid fa-grip-vertical"></i></div>
              <h2 class="flavor-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</h2>
            </div>

            <div class="controls">
              <div class="stock-box">
                <span class="stock-num">${item.stock}</span>
              </div>
              <div style="display: flex; gap: 3px;">
                <button onclick="adjustStock('${item.id}', -1)" class="btn-press btn-count">-</button>
                <button onclick="adjustStock('${item.id}', 1)" class="btn-press btn-count plus">+</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      if (sortableInstance) sortableInstance.destroy();
      sortableInstance = new Sortable(grid, {
        animation: 150,
        handle: '.drag-handle',
        touchStartThreshold: 5,
        onEnd: async function(evt) {
          const movedItem = window.flavors.splice(evt.oldIndex, 1)[0];
          window.flavors.splice(evt.newIndex, 0, movedItem);

          window.flavors.forEach((item, idx) => {
            item.order = idx;
          });

          saveToLocalStorage();
          renderFlavors();
          await persistNewOrder();
        }
      });

      // Double click / tap to edit flavor rows
      grid.querySelectorAll('.draggable-row[data-flavor-id]').forEach(row => {
        const flavorId = row.getAttribute('data-flavor-id');
        row.addEventListener('dblclick', (e) => {
          if (e.target.closest('button') || e.target.closest('.drag-handle')) return;
          openEditModal(flavorId);
        });
      });

      // Double click / tap to edit divider rows
      grid.querySelectorAll('.divider-row[data-divider-id]').forEach(row => {
        const dividerId = row.getAttribute('data-divider-id');
        row.addEventListener('dblclick', (e) => {
          if (e.target.closest('button') || e.target.closest('.drag-handle')) return;
          editDivider(dividerId);
        });
      });
    };

    window.addDivider = async function() {
      const label = prompt('Divider label (optional):', '') || '';
      const newId = 'div_' + Date.now();
      const newOrder = window.flavors.length;
      const newDivider = { id: newId, name: label.trim(), isDivider: true, order: newOrder };

      window.flavors.push(newDivider);
      saveToLocalStorage();
      renderFlavors();

      if (db) {
        try {
          const docRef = doc(db, 'icecream_flavors', newId);
          await setDoc(docRef, { name: label.trim(), isDivider: true, order: newOrder });
        } catch (err) { console.error(err); }
      }
    };

    window.editDivider = async function(id) {
      const item = window.flavors.find(f => f.id === id);
      if (!item) return;
      const newLabel = prompt('Edit divider label:', item.name);
      if (newLabel === null) return;

      item.name = newLabel.trim();
      saveToLocalStorage();
      renderFlavors();

      if (db) {
        try {
          await updateDoc(doc(db, 'icecream_flavors', id), { name: item.name });
        } catch (err) { console.error(err); }
      }
    };

    window.deleteDivider = async function(id) {
      window.flavors = window.flavors.filter(f => f.id !== id);
      window.flavors.forEach((f, idx) => f.order = idx);
      saveToLocalStorage();
      renderFlavors();
      if (db) {
        try {
          await deleteDoc(doc(db, 'icecream_flavors', id));
          await persistNewOrder();
        } catch (err) { console.error(err); }
      }
    };

    async function persistNewOrder() {
      if (!db) return;
      try {
        const batch = writeBatch(db);
        window.flavors.forEach((item, idx) => {
          const docRef = doc(db, 'icecream_flavors', item.id);
          batch.update(docRef, { order: idx });
        });
        await batch.commit();
      } catch (err) { console.error(err); }
    }

    window.adjustStock = async function(id, delta) {
      const item = window.flavors.find(f => f.id === id);
      if (!item) return;
      item.stock = Math.max(0, (Number(item.stock) || 0) + delta);
      saveToLocalStorage();
      renderFlavors();
      if (db) {
        try {
          await updateDoc(doc(db, 'icecream_flavors', id), { stock: item.stock });
        } catch (err) { console.error(err); }
      }
    };

    window.openEditModal = function(id) {
      const item = window.flavors.find(f => f.id === id);
      if (!item) return;
      document.getElementById('editFlavorId').value = item.id;
      document.getElementById('editFlavorName').value = item.name;
      document.getElementById('editFlavorStock').value = item.stock;
      document.getElementById('editModal').classList.remove('hidden');
    };

    window.closeEditModal = function() {
      document.getElementById('editModal').classList.add('hidden');
    };

    window.saveFlavorEdit = async function() {
      const id = document.getElementById('editFlavorId').value;
      const name = document.getElementById('editFlavorName').value.trim();
      const stock = parseInt(document.getElementById('editFlavorStock').value, 10) || 0;
      if (!name) return;

      const item = window.flavors.find(f => f.id === id);
      if (item) {
        item.name = name;
        item.stock = stock;
        saveToLocalStorage();
        renderFlavors();
      }
      closeEditModal();
      if (db) {
        try {
          await updateDoc(doc(db, 'icecream_flavors', id), { name, stock });
        } catch (err) { console.error(err); }
      }
    };

    window.deleteCurrentFlavor = function() {
      const id = document.getElementById('editFlavorId').value;
      const item = window.flavors.find(f => f.id === id);
      if (!item) return;
      closeEditModal();
      if (confirm(`Delete "${item.name}"?`)) {
        window.flavors = window.flavors.filter(f => f.id !== id);
        window.flavors.forEach((f, idx) => f.order = idx);
        saveToLocalStorage();
        renderFlavors();
        if (db) {
          deleteDoc(doc(db, 'icecream_flavors', id));
          persistNewOrder();
        }
      }
    };

    window.openAddFlavorModal = function() {
      document.getElementById('addFlavorName').value = '';
      document.getElementById('addFlavorStock').value = '10';
      document.getElementById('addModal').classList.remove('hidden');
    };
    window.closeAddModal = function() {
      document.getElementById('addModal').classList.add('hidden');
    };

    window.saveNewFlavor = async function() {
      const name = document.getElementById('addFlavorName').value.trim();
      const stock = parseInt(document.getElementById('addFlavorStock').value, 10) || 0;
      if (!name) return;

      const newId = 'f_' + Date.now();
      const newOrder = window.flavors.length;
      const newFlavor = { id: newId, name, stock, order: newOrder, isDivider: false };

      window.flavors.push(newFlavor);
      saveToLocalStorage();
      renderFlavors();
      closeAddModal();

      if (db) {
        try {
          await setDoc(doc(db, 'icecream_flavors', newId), { name, stock, order: newOrder, isDivider: false });
        } catch (err) { console.error(err); }
      }
    };

    window.openPwaModal = function() { document.getElementById('pwaModal').classList.remove('hidden'); }
    window.closePwaModal = function() { document.getElementById('pwaModal').classList.add('hidden'); }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
