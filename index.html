<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ScoopTrack - Ice Cream Stock Tracker</title>

  <!-- iOS PWA Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ScoopTrack">
  <link rel="apple-touch-icon" href="https://img.icons8.com/3d-fluency/180/ice-cream-cone.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'],
          },
          colors: {
            iosBg: '#F2F2F7',
            iosCard: 'rgba(255, 255, 255, 0.88)',
            iosBlue: '#007AFF',
            iosRed: '#FF3B30',
            iosGreen: '#34C759',
            iosAmber: '#FF9500',
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- SortableJS for flawless Mobile & Desktop Touch Dragging -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    /* iOS Custom Styling & Touch Enhancements */
    body {
      background-color: #F2F2F7;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding-bottom: env(safe-area-inset-bottom, 20px);
      padding-top: env(safe-area-inset-top, 0px);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .glass-nav {
      background: rgba(249, 249, 249, 0.88);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.12);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 10px;
    }

    .btn-press {
      transition: transform 0.1s ease, opacity 0.1s ease;
    }
    .btn-press:active {
      transform: scale(0.93);
      opacity: 0.8;
    }

    /* Sortable Dragging Visual State */
    .sortable-ghost {
      opacity: 0.3;
      background-color: #bae6fd !important;
    }
    .sortable-chosen {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="text-slate-900 font-sans antialiased min-h-screen flex flex-col pb-12">

  <!-- Header / Navigation Bar -->
  <header class="sticky top-0 z-30 glass-nav px-4 py-3 sm:px-6 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white shadow-md shadow-pink-200">
          <i class="fa-solid fa-ice-cream text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-slate-900 leading-tight">ScoopTrack</h1>
          <p class="text-[11px] text-slate-500 font-medium leading-none" id="syncStatus">
            <i class="fa-solid fa-circle-notch fa-spin text-iosBlue mr-1"></i> Loading app...
          </p>
        </div>
      </div>

      <!-- Header Action Buttons -->
      <div class="flex items-center space-x-2">
        <button onclick="openPwaModal()" class="btn-press px-3 py-1.5 rounded-full bg-white/80 border border-slate-200 text-xs font-semibold text-slate-700 shadow-sm flex items-center space-x-1">
          <i class="fa-solid fa-square-plus text-iosBlue"></i>
          <span class="hidden sm:inline">Add to Home Screen</span>
        </button>
        <button onclick="addDivider()" class="btn-press px-3 py-1.5 rounded-full bg-slate-200/80 border border-slate-300 text-xs font-semibold text-slate-700 shadow-sm flex items-center space-x-1" title="Add Divider">
          <i class="fa-solid fa-grip-lines text-slate-500"></i>
          <span class="hidden sm:inline">Add Divider</span>
        </button>
        <button onclick="openAddFlavorModal()" class="btn-press w-8 h-8 rounded-full bg-iosBlue text-white flex items-center justify-center shadow-md shadow-blue-200" title="Add New Flavor">
          <i class="fa-solid fa-plus text-xs"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-3 sm:px-6 pt-3 w-full flex-grow">

    <!-- Metrics Summary Dashboard -->
    <section class="grid grid-cols-2 gap-2.5 mb-3">
      <div class="glass-card rounded-2xl p-2.5 sm:p-3 text-center shadow-sm">
        <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Total Tubs</p>
        <p id="statTotalStock" class="text-xl sm:text-2xl font-black text-slate-800 mt-0.5">0</p>
      </div>
      <div class="glass-card rounded-2xl p-2.5 sm:p-3 text-center shadow-sm">
        <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider">Flavors</p>
        <p id="statTotalFlavors" class="text-xl sm:text-2xl font-black text-slate-800 mt-0.5">0</p>
      </div>
    </section>

    <!-- Compact Full-Width Vertical List -->
    <section id="flavorGrid" class="flex flex-col space-y-1.5 w-full">
      <!-- Row Cards rendered via JS -->
    </section>

    <!-- Empty State Container -->
    <div id="emptyState" class="hidden text-center py-12 px-4">
      <div class="w-12 h-12 mx-auto mb-2 text-slate-300">
        <i class="fa-solid fa-box-open text-4xl"></i>
      </div>
      <h3 class="text-sm font-semibold text-slate-700">No flavors found</h3>
      <p class="text-xs text-slate-500 mt-0.5">Try adjusting search settings.</p>
    </div>

  </main>

  <!-- EDIT FLAVOR MODAL -->
  <div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl transform transition-all">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-base font-bold text-slate-900">Edit Flavor Details</h3>
        <button onclick="closeEditModal()" class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <input type="hidden" id="editFlavorId">

      <div class="space-y-3.5 text-xs">
        <div>
          <label class="block font-semibold text-slate-500 uppercase mb-1">Flavor Name</label>
          <input type="text" id="editFlavorName" class="w-full px-3 py-2 rounded-xl border border-slate-200 font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-iosBlue">
        </div>

        <div>
          <label class="block font-semibold text-slate-500 uppercase mb-1">Stock Count</label>
          <input type="number" id="editFlavorStock" min="0" class="w-full px-3 py-2 rounded-xl border border-slate-200 font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-iosBlue">
        </div>
      </div>

      <div class="flex items-center space-x-2 mt-5">
        <button onclick="deleteCurrentFlavor()" class="px-3.5 py-2 rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50 text-xs font-bold transition">
          Delete
        </button>
        <div class="flex-grow flex space-x-2">
          <button onclick="closeEditModal()" class="flex-1 py-2 rounded-xl border border-slate-200 text-slate-600 text-xs font-bold hover:bg-slate-50">
            Cancel
          </button>
          <button onclick="saveFlavorEdit()" class="flex-1 py-2 rounded-xl bg-iosBlue text-white text-xs font-bold shadow-md shadow-blue-200 hover:bg-blue-600">
            Save Changes
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ADD FLAVOR MODAL -->
  <div id="addModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-base font-bold text-slate-900">Add New Flavor</h3>
        <button onclick="closeAddModal()" class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-slate-500 uppercase mb-1">Flavor Name</label>
          <input type="text" id="addFlavorName" placeholder="e.g. Salted Caramel Crunch" class="w-full px-3 py-2 rounded-xl border border-slate-200 font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-iosBlue">
        </div>

        <div>
          <label class="block font-semibold text-slate-500 uppercase mb-1">Initial Stock Level</label>
          <input type="number" id="addFlavorStock" value="10" min="0" class="w-full px-3 py-2 rounded-xl border border-slate-200 font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-iosBlue">
        </div>
      </div>

      <div class="flex items-center space-x-2 mt-5">
        <button onclick="closeAddModal()" class="flex-1 py-2 rounded-xl border border-slate-200 text-slate-600 text-xs font-bold hover:bg-slate-50">
          Cancel
        </button>
        <button onclick="saveNewFlavor()" class="flex-1 py-2 rounded-xl bg-iosBlue text-white text-xs font-bold shadow-md shadow-blue-200 hover:bg-blue-600">
          Add Flavor
        </button>
      </div>
    </div>
  </div>

  <!-- iOS PWA INSTALLATION MODAL -->
  <div id="pwaModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white rounded-t-3xl sm:rounded-3xl max-w-md w-full p-5 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center
